<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Что посмотреть</title>
  <meta name="description" content="Подбор фильма на вечер: популярное, топ-250 и премьеры Кинопоиска, фильтры по настроению, рулетка и список «посмотреть позже».">
  <meta name="theme-color" content="#0c0a0b">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>ЧТО ПОСМОТРЕТЬ<span>?</span></h1>
    <p>Выберите настроение — подберём фильм на вечер</p>
    <button class="roulette-btn" id="rouletteBtn">🎰 Мне повезёт</button>
  </header>

  <main class="app">
    <section class="filters">
      <div class="chips" id="collections" aria-label="Подборки"></div>
      <div class="chips" id="moods" aria-label="Настроение"></div>
      <div class="row">
        <input id="search" class="input" type="search" placeholder="Поиск по названию" aria-label="Поиск" enterkeyhint="search">
        <select id="genre" class="input" aria-label="Жанр"></select>
        <select id="decade" class="input" aria-label="Десятилетие"></select>
        <select id="sort" class="input" aria-label="Сортировка">
          <option value="default">Как в подборке</option>
          <option value="rating">По рейтингу</option>
          <option value="new">Сначала новые</option>
        </select>
      </div>
    </section>

    <nav class="tabs">
      <button class="tab is-active" data-tab="all">Фильмы <span id="countAll"></span></button>
      <button class="tab" data-tab="list">Посмотреть позже <span id="countList"></span></button>
      <span class="source" id="source"></span>
    </nav>

    <section class="grid" id="grid" aria-live="polite"></section>
    <button class="more" id="moreBtn" hidden>Показать ещё</button>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal__box" id="modalBox"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
